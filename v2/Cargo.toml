[package]
name = "tezbar-qrcode-generator"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"

[dependencies]
tezbar-extension-sdk = { git = "https://github.com/almatkai/tezbar-extension-sdk-rust.git", rev = "e955911f0bf5b558f9d3eb5183df0adc95c22af2" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
tokio = { version = "=1.48.0", features = ["rt-multi-thread", "macros", "io-util", "time", "sync", "net"] }
qrcode = { version = "=0.14.1", default-features = false }
png = "=0.17.16"
base64 = "=0.22.1"
url = "=2.5.4"
regex = "=1.12.2"
reqwest = { version = "=0.12.24", default-features = false, features = ["rustls-tls", "stream"] }
uuid = { version = "=1.23.3", features = ["v4"] }
sha2 = "=0.10.9"
dirs = "=6.0.0"
same-file = "=1.0.6"

[dev-dependencies]
semver = "=1.0.27"
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }
tempfile = "=3.23.0"
rqrr = "=0.9.3"
image = { version = "=0.25.5", default-features = false, features = ["png"] }
